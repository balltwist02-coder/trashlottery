<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Копаю участок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<style>
/* Layout: full-height Telegram Mini App — pixel scene fills the screen, tool bar pinned to the bottom. */
:root{
  --bg:#1b2a3a; --bar:#14202c; --slot:#22344a; --slot-edge:#2f4a66; --slot-dark:#0e1620;
  --active:#f2c14e; --active-glow:rgba(242,193,78,.35); --fg:#e9f0ee; --muted:#8fa3ad;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#2f4f7a}
canvas{position:absolute;left:50%;top:0;transform:translateX(-50%);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.depth{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:rgba(10,16,24,.55);padding:3px 7px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums}
.bar{flex:none;background:var(--bar);border-top:2px solid var(--slot-dark);display:flex;justify-content:center;gap:8px;padding-top:10px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.slot{width:54px;height:54px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -4px 0 0 var(--slot-dark);transition:transform .08s}
.slot:disabled{cursor:default;opacity:.55}
.slot canvas{position:static;transform:none;width:48px;height:48px}
.slot[aria-pressed="true"]{background:#3a3220;box-shadow:inset 0 0 0 2px var(--active),inset 0 -4px 0 0 #8a6a1e,0 0 0 2px var(--slot-dark),0 0 14px var(--active-glow);transform:translateY(-3px)}
.slot:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.slot.nudge{animation:nudge .35s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mapbtn{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -4px 0 0 var(--slot-dark)}
.mapbtn canvas,.cell canvas,.close canvas{position:static;transform:none}
.mapbtn canvas{width:32px;height:32px}
.mapbtn:focus-visible,.close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mapwrap{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(6,10,16,.6);padding:16px}
.map{position:relative;background:var(--bar);box-shadow:inset 0 0 0 2px var(--slot-edge),0 0 0 2px var(--slot-dark);border-radius:2px;padding:14px;width:min(100%,340px)}
.map h2{margin:0 0 12px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);padding-right:40px}
.close{position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -3px 0 0 var(--slot-dark)}
.close canvas{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;display:grid;place-items:center;background:#1a1612;border-radius:2px;box-shadow:inset 0 0 0 2px #2a221b,inset 0 -3px 0 0 #0c0a08}
.cell canvas{width:60%;height:60%}
.cell.on{background:#3a3220;box-shadow:inset 0 0 0 2px var(--active),inset 0 -3px 0 0 #8a6a1e,0 0 12px var(--active-glow)}
.cell.on canvas{width:84%;height:84%}
@media (prefers-reduced-motion:reduce){.slot{transition:none}.slot.nudge{animation:none}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Участок"></canvas>
    <div class="depth" id="depth">0 / 30</div>
    <button class="mapbtn" id="mapbtn" aria-label="Карта участков" aria-haspopup="dialog"></button>
  </div>
  <div class="bar" role="toolbar" aria-label="Инструменты">
    <button class="slot" id="pick" aria-pressed="false" aria-label="Кирка"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
  </div>
  <div class="mapwrap" id="mapwrap" hidden>
    <div class="map" role="dialog" aria-modal="true" aria-labelledby="maptitle">
      <h2 id="maptitle">Участки</h2>
      <button class="close" id="mapclose" aria-label="Закрыть карту"></button>
      <div class="grid" id="mapgrid"></div>
    </div>
  </div>
</div>

function prepare(){
  // flat silhouettes for tap detection: index 0 = occluder, 1..4 = diggable cells
  const cols=['#000000','#010000','#020000','#030000','#040000'];
  MASK=cols.map(c=>{const m=document.createElement('canvas');m.width=m.height=64;const x=m.getContext('2d');x.drawImage(SPR['З'],0,0);x.globalCompositeOperation='source-in';x.fillStyle=c;x.fillRect(0,0,64,64);return m});
  // lighter copies shown on diggable blocks while the pickaxe is active
  for(const n of names){const m=document.createElement('canvas');m.width=m.height=64;const x=m.getContext('2d');x.beginPath();x.moveTo(32,0);x.lineTo(64,16);x.lineTo(32,32);x.lineTo(0,16);x.closePath();x.clip();x.drawImage(SPR[n],0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(255,236,190,.22)';x.fillRect(0,0,64,64);GLOW[n]=m}
}
const spriteName=(i,j,z)=>{const c=code(i,j,z);return c==='*'||c==='З'?['З','З1','З2'][hash(i,j,z)]:c};

/* ---------- scene ---------- */
let camY=0,camTarget=0,follow=true,shake=0,fx=[];
const maxCam=()=>Math.min(cur(),DIG-1)*BH;   // ниже текущего слоя листать нельзя
const clampCam=v=>Math.max(0,Math.min(maxCam(),v));
const TOP=()=>Math.round(H*.30)-BH;          // где верх участка, когда камера наверху
function org(i,j,z){return [Math.round(W/2+(i-j)*32-32),Math.round(TOP()+(i+j)*16+z*BH-camY)]}
function blockExists(i,j,z){if(code(i,j,z)==='.')return false;const a=isAct(i,j);return a<0||d[a]<=z}
function diggable(a,z){return d[a]===z&&z===cur()&&z<DIG}
function forEachBlock(fn){
  const z0=Math.max(0,Math.floor((camY-H)/BH)-1),z1=Math.min(LAYERS-1,Math.floor((camY+H)/BH)+2);
  for(let z=z1;z>=z0;z--)for(let s=0;s<=2*(N-1);s++)for(let i=0;i<N;i++){const j=s-i;if(j<0||j>=N)continue;
    if(!blockExists(i,j,z))continue;const [x,y]=org(i,j,z);if(y>H||y<-BW)continue;fn(i,j,z,x,y)}
}
function draw(t){
  if(follow)camTarget=maxCam();
  if(!drag&&Math.abs(vel)>.05){camTarget=clampCam(camTarget+vel);vel*=.92;if(camTarget>=maxCam())follow=true}
  if(drag)camY=camTarget;else{camY+=(camTarget-camY)*.18;if(Math.abs(camTarget-camY)<.3)camY=camTarget}
  ctx.drawImage(bg,0,0);
  const sx=shake>0?(Math.random()<.5?-1:1):0,sy=shake>0?(Math.random()<.5?-1:0):0;if(shake>0)shake--;
  ctx.save();ctx.translate(sx,sy);
  const pulse=.55+.45*Math.sin(t/260);
  forEachBlock((i,j,z,x,y)=>{
    const a=isAct(i,j),n=spriteName(i,j,z);
    ctx.drawImage(SPR[n],x,y);
    if(active&&a>=0&&diggable(a,z)){ctx.globalAlpha=pulse;ctx.drawImage(GLOW[n],x,y);ctx.globalAlpha=1}
  });
  fx=fx.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.l--;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);return p.l>0});
  ctx.restore();
  document.getElementById('depth').textContent=Math.min(cur(),DIG)+' / '+DIG;
  requestAnimationFrame(draw);
}

/* ---------- input ---------- */
/* по какому блоку тапнули: чистая геометрия, без чтения пикселей (браузеры с защитой от слежки искажают пиксели) */
function inCube(lx,ly){if(lx<0||lx>64)return false;const top=lx<=32?16-lx/2:(lx-32)/2,bot=lx<=32?48+lx/2:80-lx/2;return ly>=top&&ly<=bot}
function hit(px,py){
  let res=-1;   // последний нарисованный блок под пальцем = самый передний
  forEachBlock((i,j,z,x,y)=>{if(inCube(px-x,py-y)){const a=isAct(i,j);res=a>=0&&diggable(a,z)?a:-1}});
  return res;
}
const pickBtn=document.getElementById('pick');
pickBtn.addEventListener('click',()=>{active=!active;pickBtn.setAttribute('aria-pressed',active);haptic('light')});
/* прокрутка: палец или мышь тянет участок вверх-вниз, колесо мыши листает */
let drag=null,vel=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={y:e.clientY,cam:camTarget,moved:false,lastY:e.clientY,lastT:performance.now()};vel=0});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dy=(e.clientY-drag.y)/SCALE;
  if(!drag.moved&&Math.abs(dy)>4)drag.moved=true;
  if(drag.moved){camTarget=clampCam(drag.cam-dy);follow=camTarget>=maxCam();
    const now=performance.now(),dt=Math.max(1,now-drag.lastT);vel=-(e.clientY-drag.lastY)/SCALE/dt*16;drag.lastY=e.clientY;drag.lastT=now}});
const endDrag=e=>{if(!drag)return;const wasTap=!drag.moved,still=performance.now()-drag.lastT>80;drag=null;if(wasTap){vel=0;tap(e)}else if(still)vel=0};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{drag=null;vel=0});
cv.addEventListener('wheel',e=>{e.preventDefault();vel=0;camTarget=clampCam(camTarget+e.deltaY/SCALE*.6);follow=camTarget>=maxCam()},{passive:false});
const CRUMB={'Т':['#46823a','#25562e','#4d2b32','#7a4836'],'З':['#ad7757','#7a4841','#4d2b32','#341c27'],'*':['#ad7757','#7a4841','#4d2b32','#341c27'],
  'П':['#8a5a44','#5e3a33','#3d2329','#2a1820'],'Г':['#c06a4a','#9a4a3a','#6e3030','#4a2026'],'Б':['#9aa3a8','#6c757c','#474e55','#2c3136'],
  'К':['#a7b0b6','#7d878e','#565f66','#363c42'],'Р':['#5fa04a','#ad7757','#7a4841','#3d2329'],'В':['#6fb552','#3f7a35','#9a4a3a','#4a2026'],'Я':['#5fa04a','#4d2b32','#7a4836','#2a1820']};
function tap(e){
  const r=cv.getBoundingClientRect();const px=Math.floor((e.clientX-r.left)/SCALE),py=Math.floor((e.clientY-r.top)/SCALE);
  const a=hit(px,py);if(a<0||!diggable(a,d[a]))return;
  if(!active){pickBtn.classList.remove('nudge');void pickBtn.offsetWidth;pickBtn.classList.add('nudge');haptic('warn');return}
  const z=d[a];const [x,y]=org(ACT[a][0],ACT[a][1],z);
  const cols=CRUMB[code(ACT[a][0],ACT[a][1],z)]||CRUMB['З'];
  for(let k=0;k<16;k++)fx.push({x:x+32+(Math.random()-.5)*24,y:y+16+(Math.random()-.5)*10,vx:(Math.random()-.5)*2.2,vy:-Math.random()*2.6-.6,l:24+Math.random()*12|0,c:cols[k%4],s:Math.random()<.35?2:1});
  d[a]++;settle();shake=5;haptic('light');
}

/* ---------- карта участков ---------- */
const MAPN=5, HOME=12;                        // сетка 5×5, наш участок — в центре
const mapwrap=document.getElementById('mapwrap'),mapbtn=document.getElementById('mapbtn'),mapclose=document.getElementById('mapclose');
icon(XI,{k:'#10141f',x:'#e9f0ee'},mapclose);
function buildMap(){const g=document.getElementById('mapgrid');
  for(let k=0;k<MAPN*MAPN;k++){const c=document.createElement('div');c.className='cell'+(k===HOME?' on':'');
    if(k===HOME){c.setAttribute('aria-label','Текущий участок');const m=document.createElement('canvas');m.width=m.height=64;m.getContext('2d').drawImage(SPR['Т'],0,0);c.appendChild(m)}
    else{c.setAttribute('aria-label','Закрыто');icon(XI,{k:'#0c0a08',x:'#6e3030'},c)}
    g.appendChild(c)}}
mapbtn.addEventListener('click',()=>{mapwrap.hidden=false;mapclose.focus();haptic('light')});
mapclose.addEventListener('click',()=>{mapwrap.hidden=true;mapbtn.focus();haptic('light')});

function start(){buildMap();prepare();resize();addEventListener('resize',resize);if(tg)tg.onEvent&&tg.onEvent('viewportChanged',resize);requestAnimationFrame(draw)}
</script>
