<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Копаю участок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<style>
/* Layout: full-height Telegram Mini App — pixel scene fills the screen, tool bar pinned to the bottom. */
:root{
  --bg:#1b2a3a; --bar:#14202c; --slot:#22344a; --slot-edge:#2f4a66; --slot-dark:#0e1620;
  --active:#f2c14e; --active-glow:rgba(242,193,78,.35); --fg:#e9f0ee; --muted:#8fa3ad;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#2f4f7a}
canvas{position:absolute;left:50%;top:0;transform:translateX(-50%);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.depth{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:rgba(10,16,24,.55);padding:3px 7px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums}
.bar{flex:none;background:var(--bar);border-top:2px solid var(--slot-dark);display:flex;justify-content:center;gap:8px;padding-top:10px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.slot{width:54px;height:54px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -4px 0 0 var(--slot-dark);transition:transform .08s}
.slot:disabled{cursor:default;opacity:.55}
.slot canvas{position:static;transform:none;width:48px;height:48px}
.slot[aria-pressed="true"]{background:#3a3220;box-shadow:inset 0 0 0 2px var(--active),inset 0 -4px 0 0 #8a6a1e,0 0 0 2px var(--slot-dark),0 0 14px var(--active-glow);transform:translateY(-3px)}
.slot:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.slot.nudge{animation:nudge .35s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:60%;text-align:center;font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b1406;background:var(--active);padding:5px 10px;border-radius:2px;box-shadow:0 2px 0 #8a6a1e;pointer-events:none}
.mapbtn{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -4px 0 0 var(--slot-dark)}
.mapbtn canvas,.cell canvas,.close canvas{position:static;transform:none}
.mapbtn canvas{width:32px;height:32px}
.mapbtn:focus-visible,.close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mapwrap{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(6,10,16,.6);padding:16px}
.map{position:relative;background:var(--bar);box-shadow:inset 0 0 0 2px var(--slot-edge),0 0 0 2px var(--slot-dark);border-radius:2px;padding:14px;width:min(100%,340px)}
.map h2{margin:0 0 12px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);padding-right:40px}
.close{position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -3px 0 0 var(--slot-dark)}
.close canvas{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;display:grid;place-items:center;background:#1a1612;border-radius:2px;box-shadow:inset 0 0 0 2px #2a221b,inset 0 -3px 0 0 #0c0a08}
.cell canvas{width:60%;height:60%}
.cell.on{background:#3a3220;box-shadow:inset 0 0 0 2px var(--active),inset 0 -3px 0 0 #8a6a1e,0 0 12px var(--active-glow)}
.cell.on canvas{width:84%;height:84%}
@media (prefers-reduced-motion:reduce){.slot{transition:none}.slot.nudge{animation:none}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Участок"></canvas>
    <div class="depth" id="depth">0 / 30</div>
    <div class="toast" id="toast" role="status" hidden></div>
    <button class="mapbtn" id="mapbtn" aria-label="Карта участков" aria-haspopup="dialog"></button>
  </div>
  <div class="bar" role="toolbar" aria-label="Инструменты">
    <button class="slot" id="pick" aria-pressed="false" aria-label="Кирка"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
    <button class="slot" disabled aria-label="Пустой слот"></button>
  </div>
  <div class="mapwrap" id="mapwrap" hidden>
    <div class="map" role="dialog" aria-modal="true" aria-labelledby="maptitle">
      <h2 id="maptitle">Участки</h2>
      <button class="close" id="mapclose" aria-label="Закрыть карту"></button>
      <div class="grid" id="mapgrid"></div>
    </div>
  </div>
</div>

  SCALE=Math.max(1,Math.floor(r.width/176));
  W=Math.ceil(r.width/SCALE);H=Math.ceil(r.height/SCALE);
  cv.width=W;cv.height=H;cv.style.width=W*SCALE+'px';cv.style.height=H*SCALE+'px';
  pickCv.width=W;pickCv.height=H;
  ctx.imageSmoothingEnabled=false;pctx.imageSmoothingEnabled=false;
  makeBg();
}
function makeBg(){
  bg=document.createElement('canvas');bg.width=W;bg.height=H;const x=bg.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b4a78');g.addColorStop(.6,'#4f8ea0');g.addColorStop(1,'#7cc0b6');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const rows=[['#3d7891','#9fe0d6',.10,.30],['#2f6278','#c8f0e0',.07,.42],['#24506a','#f7e7a6',.05,.56]];
  rows.forEach(([col,win,p,base],L)=>{let xx=-6;const seed=L*997;
    while(xx<W){const r1=((Math.sin(xx*12.9898+seed)*43758.5453)%1+1)%1,r2=((Math.sin(xx*78.233+seed)*12345.678)%1+1)%1;
      const w=10+Math.floor(r1*20),h=Math.floor(H*(base+r2*.25));const y=H-h;
      x.fillStyle=col;x.fillRect(xx,y,w,h);x.fillStyle=win;
      for(let wy=y+3;wy<H-2;wy+=4)for(let wx=xx+2;wx<xx+w-2;wx+=3){const q=((Math.sin(wx*3.1+wy*7.7+seed)*9999)%1+1)%1;if(q<p)x.fillRect(wx,wy,1,2)}
      xx+=w+1}});
}

/* ---------- sprites ---------- */
const SPR={},TIMG={};let loaded=0;
const names=Object.keys(IMG);
const loads=names.map(n=>[n,IMG[n],im=>SPR[n]=im]);
for(const type in TRASH)TRASH[type].forEach((v,k)=>{loads.push(['',v.img,im=>TIMG[type+k]=im]);loads.push(['',v.grey,im=>TIMG[type+k+'g']=im])});
loads.forEach(([,src,put])=>{const im=new Image();im.onload=()=>{put(im);if(++loaded===loads.length)start()};im.src=src});
let GLOW={},PIECE={};
/* маска куба 64×64 — ровно те пиксели, что считаются кубом при тапе */
function cubeMask(){const m=document.createElement('canvas');m.width=m.height=64;const x=m.getContext('2d');x.fillStyle='#000';
  for(let lx=0;lx<64;lx++){const c=lx+.5,top=c<=32?16-c/2:(c-32)/2,bot=c<=32?48+c/2:80-c/2;x.fillRect(lx,Math.round(top),1,Math.round(bot)-Math.round(top))}return m}
function prepare(){
  // lighter copies shown on diggable blocks while the pickaxe is active
  for(const n of names){const m=document.createElement('canvas');m.width=m.height=64;const x=m.getContext('2d');x.beginPath();x.moveTo(32,0);x.lineTo(64,16);x.lineTo(32,32);x.lineTo(0,16);x.closePath();x.clip();x.drawImage(SPR[n],0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(255,236,190,.22)';x.fillRect(0,0,64,64);GLOW[n]=m}
  // мусор нарисован на холсте всего участка 2×2; режем его на куски по клеткам, чтобы рисовать вперемешку с блоками
  const mask=cubeMask();
  for(const type in TRASH)TRASH[type].forEach((v,k)=>{PIECE[type+k]=v.cells.map(([i,j])=>['','g'].map(g=>{
    const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
    x.drawImage(TIMG[type+k+g],-(32+(i-j)*32),-((i+j-2)*16));x.globalCompositeOperation='destination-in';x.drawImage(mask,0,0);return c}))});
}
const spriteName=(i,j,z)=>{const c=code(i,j,z);return c==='*'||c==='З'?['З','З1','З2'][hash(i,j,z)]:c};

/* ---------- мусор ---------- */
const TINFO={coffee:{name:'Банка кофе',size:1},beam:{name:'Металлическая балка',size:2},scooter:{name:'Самокат',size:3},bones:{name:'Кости динозавра',size:4}};
const BYSIZE=['','coffee','beam','scooter','bones'];
const SIZE_W=[0,70,40,20,10];                 // шансы размеров 70/40/20/10 — как веса
const trash=[];
const colsOf=cells=>cells.map(([i,j])=>isAct(i,j));
function placements(type,k){const out=[];for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
  const cells=TRASH[type][k].cells.map(([i,j])=>[i+di,j+dj]);if(cells.every(([i,j])=>isAct(i,j)>=0))out.push(cells)}return out}
function genTrash(){
  for(let z=1;z<DIG;z++){
    if(ACT.some(([i,j])=>code(i,j,z)==='.'))continue;      // только в слоях из 4 заполненных блоков
    if(Math.random()>=.6)continue;                          // мусор в слое с шансом 60%
    let r=Math.random()*100,size=1;for(let s=1;s<=4;s++){if(r<SIZE_W[s]){size=s;break}r-=SIZE_W[s]}
    const type=BYSIZE[size],opts=[];
    TRASH[type].forEach((v,k)=>placements(type,k).forEach(cells=>opts.push({k,cells})));
    const o=opts[Math.random()*opts.length|0];
    trash.push({type,k:o.k,cells:o.cells,layer:z,lvl:z,ry:z,vy:0,active:false,lifted:false,falling:false});
  }
}
function blockSolid(a,z){if(z>=DIG)return true;const [i,j]=ACT[a];return z>=d[a]&&code(i,j,z)!=='.'}
const trashAt=(a,z,ex)=>trash.find(t=>t!==ex&&!t.lifted&&t.lvl===z&&colsOf(t.cells).includes(a));
const solid=(a,z,ex)=>blockSolid(a,z);                      // мусор опирается только на блоки: предметы друг друга не замечают и просто накладываются
function restLevel(t){const cs=colsOf(t.cells);for(let z=t.lvl+1;z<=DIG;z++)if(cs.some(a=>solid(a,z,t)))return z-1;return DIG-1}
function topSolid(a,ex){for(let z=0;z<=DIG;z++)if(solid(a,z,ex))return z;return DIG}
const hoverFor=(cells,t)=>Math.max(-1,Math.min(...colsOf(cells).map(a=>topSolid(a,t)))-2);
function updateTrash(){
  for(const t of trash)if(!t.active&&colsOf(t.cells).every(a=>d[a]>t.layer)){t.active=true;reveal(t)}
  for(let moved=true,g=0;moved&&g<60;g++){moved=false;           // гравитация: снизу вверх, пока всё не ляжет
    for(const t of [...trash].sort((p,q)=>q.lvl-p.lvl)){if(!t.active||t.lifted)continue;const r=restLevel(t);if(r>t.lvl){t.lvl=r;t.falling=true;moved=true}}}
}
function centerOf(cells,lvl){let sx=0,sy=0;for(const [i,j] of cells){const [x,y]=org(i,j,lvl);sx+=x+32;sy+=y+32}return [sx/cells.length,sy/cells.length]}
function reveal(t){const [cx,cy]=centerOf(t.cells,t.lvl);
  for(let k=0;k<22;k++)fx.push({x:cx+(Math.random()-.5)*30,y:cy+(Math.random()-.5)*14,vx:(Math.random()-.5)*1.4,vy:-Math.random()*2-.4,l:30+Math.random()*16|0,c:['#fff6c8','#f2c14e','#ffffff'][k%3],s:1,g:.06});
  toast('Найдено: '+TINFO[t.type].name);haptic('medium')}
function lift(t){
  const cs=colsOf(t.cells);
  for(const o of trash)if(o.lifted)drop(o);
  t.lifted=true;t.falling=false;t.lvl=hoverFor(t.cells,t);haptic('light');return true}
function drop(t){t.lifted=false;t.lvl=Math.round(t.lvl);updateTrash()}
function landed(t){const [cx,cy]=centerOf(t.cells,t.lvl);shake=Math.max(shake,TINFO[t.type].size>2?6:3);haptic('medium');
  for(let k=0;k<14;k++)fx.push({x:cx+(Math.random()-.5)*36,y:cy+12+(Math.random()-.5)*8,vx:(Math.random()-.5)*2.4,vy:-Math.random()*1.4-.2,l:18+Math.random()*10|0,c:['#8c7a6a','#5e4c42','#b8a48c'][k%3],s:Math.random()<.3?2:1})}
/* 1–2 клетки: пока тащим — выбираем ближайшее к пальцу место среди возможных положений этой формы */
function placeNear(t,px,py){let best=null,bd=1e9;
  for(const cells of placements(t.type,t.k)){const hv=hoverFor(cells,t),[cx,cy]=centerOf(cells,hv),dd=(cx-px)**2+(cy-py)**2;if(dd<bd){bd=dd;best={cells,hv}}}
  if(best&&best.cells.some((c,m)=>c[0]!==t.cells[m][0]||c[1]!==t.cells[m][1])){t.cells=best.cells;t.lvl=best.hv;haptic('light')}}
function stepTrash(now){for(const t of trash){
  if(t.lifted){t.ry+=(t.lvl-t.ry)*.2;if(Math.abs(t.lvl-t.ry)<.02)t.ry=t.lvl;continue}
  if(t.ry<t.lvl-.001){t.vy=Math.min(t.vy+.03,.7);t.ry+=t.vy;if(t.ry>=t.lvl){t.ry=t.lvl;t.vy=0;if(t.falling)landed(t);t.falling=false}}
  else if(t.ry>t.lvl){t.ry=t.lvl;t.falling=false}else t.falling=false}}
let toastT=0;function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,1800)}

/* ---------- scene ---------- */
let camY=0,camTarget=0,follow=true,shake=0,fx=[];
const maxCam=()=>Math.min(cur(),DIG-1)*BH;   // ниже текущего слоя листать нельзя
const clampCam=v=>Math.max(0,Math.min(maxCam(),v));
const TOP=()=>Math.round(H*.30)-BH;          // где верх участка, когда камера наверху
function org(i,j,z){return [Math.round(W/2+(i-j)*32-32),Math.round(TOP()+(i+j)*16+z*BH-camY)]}
function blockExists(i,j,z){if(code(i,j,z)==='.')return false;const a=isAct(i,j);return a<0||d[a]<=z}
function diggable(a,z){return d[a]===z&&z===cur()&&z<DIG}
/* всё, что видно, в порядке рисования: снизу вверх, сзади вперёд; куски мусора встают между блоками */
function scene(now){
  const out=[],z0=Math.max(0,Math.floor((camY-H)/BH)-1),z1=Math.min(LAYERS-1,Math.floor((camY+H)/BH)+2);
  for(let z=z1;z>=z0;z--)for(let s=0;s<=2*(N-1);s++)for(let i=0;i<N;i++){const j=s-i;if(j<0||j>=N)continue;
    if(!blockExists(i,j,z))continue;const [x,y]=org(i,j,z);if(y>H||y<-BW)continue;out.push({k:0,z,s,i,j,x,y})}
  for(const t of trash){
    const bob=t.lifted?Math.round(Math.sin(now/280)*1.5)-1:0,wob=t.wob>0?(t.wob--%4<2?1:-1):0,slot=t.ry>t.lvl?Math.floor(t.ry):Math.ceil(t.ry-1e-6);   // поднимается — рисуем в верхнем слое, падает — в нижнем
    t.cells.forEach(([i,j],m)=>{const a=isAct(i,j);if(!t.active&&!(d[a]>t.layer))return;
      const [x,y]=org(i,j,t.ry);if(y>H||y<-BW)return;out.push({k:1,z:slot,s:i+j,i,j,x:x+wob,y:y+bob,t,m})})}
  out.sort((p,q)=>q.z-p.z||p.s-q.s||p.k-q.k||(p.k&&trash.indexOf(p.t)-trash.indexOf(q.t)));return out}
function draw(now){
  if(follow)camTarget=maxCam();
  if(!drag&&Math.abs(vel)>.05){camTarget=clampCam(camTarget+vel);vel*=.92;if(camTarget>=maxCam())follow=true}
  if(drag)camY=camTarget;else{camY+=(camTarget-camY)*.18;if(Math.abs(camTarget-camY)<.3)camY=camTarget}
  stepTrash(now);
  ctx.drawImage(bg,0,0);
  const sx=shake>0?(Math.random()<.5?-1:1):0,sy=shake>0?(Math.random()<.5?-1:0):0;if(shake>0)shake--;
  ctx.save();ctx.translate(sx,sy);
  const pulse=.55+.45*Math.sin(now/260);
  for(const it of scene(now)){
    if(it.k===1){ctx.drawImage(PIECE[it.t.type+it.t.k][it.m][it.t.active?0:1],it.x,it.y);continue}
    const a=isAct(it.i,it.j),n=spriteName(it.i,it.j,it.z);
    ctx.drawImage(SPR[n],it.x,it.y);
    if(active&&a>=0&&diggable(a,it.z)){ctx.globalAlpha=pulse;ctx.drawImage(GLOW[n],it.x,it.y);ctx.globalAlpha=1}
  }
  fx=fx.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||.22;p.l--;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);return p.l>0});
  ctx.restore();
  document.getElementById('depth').textContent=Math.min(cur(),DIG)+' / '+DIG;
  requestAnimationFrame(draw);
}

/* ---------- input ---------- */
/* по чему тапнули: чистая геометрия, без чтения пикселей (браузеры с защитой от слежки искажают пиксели) */
function inCube(lx,ly){if(lx<0||lx>64)return false;const top=lx<=32?16-lx/2:(lx-32)/2,bot=lx<=32?48+lx/2:80-lx/2;return ly>=top&&ly<=bot}
function hit(px,py){let res=null;for(const it of scene(performance.now()))if(inCube(px-it.x,py-it.y))res=it;return res}   // последний нарисованный = самый передний
const pickBtn=document.getElementById('pick');
pickBtn.addEventListener('click',()=>{active=!active;pickBtn.setAttribute('aria-pressed',active);haptic('light')});
const local=e=>{const r=cv.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/SCALE),Math.floor((e.clientY-r.top)/SCALE)]};
/* прокрутка: палец или мышь тянет участок вверх-вниз, колесо мыши листает; мусор 1–2 клетки можно тащить */
let drag=null,vel=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);
  const it=hit(...local(e)),g=it&&it.k===1&&it.t.active&&TINFO[it.t.type].size<=2?it.t:null;
  drag={x:e.clientX,y:e.clientY,cam:camTarget,moved:false,lastY:e.clientY,lastT:performance.now(),grab:g};vel=0});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)/SCALE,dy=(e.clientY-drag.y)/SCALE;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;
    if(drag.grab&&!drag.grab.lifted&&!lift(drag.grab))drag.grab=null;
    if(!drag.grab){drag.y=e.clientY;drag.cam=camTarget}}
  if(!drag.moved)return;
  if(drag.grab){placeNear(drag.grab,...local(e));return}
  camTarget=clampCam(drag.cam-(e.clientY-drag.y)/SCALE);follow=camTarget>=maxCam();
  const now=performance.now(),dt=Math.max(1,now-drag.lastT);vel=-(e.clientY-drag.lastY)/SCALE/dt*16;drag.lastY=e.clientY;drag.lastT=now});
const endDrag=e=>{if(!drag)return;const dr=drag,wasTap=!dr.moved,still=performance.now()-dr.lastT>80;drag=null;
  if(wasTap){vel=0;tap(e)}else if(dr.grab){vel=0;drop(dr.grab)}else if(still)vel=0};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{if(drag&&drag.grab&&drag.grab.lifted)drop(drag.grab);drag=null;vel=0});
cv.addEventListener('wheel',e=>{e.preventDefault();vel=0;camTarget=clampCam(camTarget+e.deltaY/SCALE*.6);follow=camTarget>=maxCam()},{passive:false});
const CRUMB={'Т':['#46823a','#25562e','#4d2b32','#7a4836'],'З':['#ad7757','#7a4841','#4d2b32','#341c27'],'*':['#ad7757','#7a4841','#4d2b32','#341c27'],
  'П':['#8a5a44','#5e3a33','#3d2329','#2a1820'],'Г':['#c06a4a','#9a4a3a','#6e3030','#4a2026'],'Б':['#9aa3a8','#6c757c','#474e55','#2c3136'],
  'К':['#a7b0b6','#7d878e','#565f66','#363c42'],'Р':['#5fa04a','#ad7757','#7a4841','#3d2329'],'В':['#6fb552','#3f7a35','#9a4a3a','#4a2026'],'Я':['#5fa04a','#4d2b32','#7a4836','#2a1820']};
function tap(e){
  const it=hit(...local(e));if(!it)return;
  if(it.k===1){const t=it.t;                                  // мусор: поднять / опустить
    if(!t.active){t.wob=10;haptic('warn');return}             // ещё не откопан целиком
    if(t.lifted)drop(t);else lift(t);return}
  const a=isAct(it.i,it.j);if(a<0||!diggable(a,it.z))return;
  if(!active){pickBtn.classList.remove('nudge');void pickBtn.offsetWidth;pickBtn.classList.add('nudge');haptic('warn');return}
  const z=d[a];const [x,y]=org(ACT[a][0],ACT[a][1],z);
  const cols=CRUMB[code(ACT[a][0],ACT[a][1],z)]||CRUMB['З'];
  for(let k=0;k<16;k++)fx.push({x:x+32+(Math.random()-.5)*24,y:y+16+(Math.random()-.5)*10,vx:(Math.random()-.5)*2.2,vy:-Math.random()*2.6-.6,l:24+Math.random()*12|0,c:cols[k%4],s:Math.random()<.35?2:1});
  d[a]++;settle();updateTrash();shake=5;haptic('light');
}

/* ---------- карта участков ---------- */
const MAPN=5, HOME=12;                        // сетка 5×5, наш участок — в центре
const mapwrap=document.getElementById('mapwrap'),mapbtn=document.getElementById('mapbtn'),mapclose=document.getElementById('mapclose');
icon(XI,{k:'#10141f',x:'#e9f0ee'},mapclose);
function buildMap(){const g=document.getElementById('mapgrid');
  for(let k=0;k<MAPN*MAPN;k++){const c=document.createElement('div');c.className='cell'+(k===HOME?' on':'');
    if(k===HOME){c.setAttribute('aria-label','Текущий участок');const m=document.createElement('canvas');m.width=m.height=64;m.getContext('2d').drawImage(SPR['Т'],0,0);c.appendChild(m)}
    else{c.setAttribute('aria-label','Закрыто');icon(XI,{k:'#0c0a08',x:'#6e3030'},c)}
    g.appendChild(c)}}
mapbtn.addEventListener('click',()=>{mapwrap.hidden=false;mapclose.focus();haptic('light')});
mapclose.addEventListener('click',()=>{mapwrap.hidden=true;mapbtn.focus();haptic('light')});

function start(){buildMap();genTrash();prepare();resize();addEventListener('resize',resize);if(tg)tg.onEvent&&tg.onEvent('viewportChanged',resize);requestAnimationFrame(draw)}
</script>

</body>
