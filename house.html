<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ДЕМО дом — Копаю участок — 3D проба</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script src="3d_data.js"></script>
<style>
/* Layout: full-height Telegram Mini App — pixel scene fills the whole screen; tools live in a leather pouch, bottom-left. */
:root{
  --bg:#1b2a3a; --bar:#14202c; --slot:#22344a; --slot-edge:#2f4a66; --slot-dark:#0e1620;
  --active:#f2c14e; --active-glow:rgba(242,193,78,.35); --fg:#e9f0ee; --muted:#8fa3ad;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#2f4f7a}
canvas{position:absolute;left:50%;top:0;transform:translateX(-50%);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.depth{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:44px;font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:rgba(10,16,24,.55);padding:3px 7px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums}
/* монеты: справа сверху */
.coins{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;align-items:center;gap:6px;font:800 15px ui-monospace,Menlo,Consolas,monospace;color:#ffe08a;background:rgba(10,16,24,.62);padding:3px 9px 3px 6px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #5a3a10}
.coins .ci canvas{display:block;position:static;transform:none;width:18px;height:18px;image-rendering:pixelated}
.coins.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}100%{transform:scale(1)}}
.plus{position:absolute;z-index:5;font:800 16px ui-monospace,Menlo,Consolas,monospace;color:#ffe08a;text-shadow:0 2px 0 #5a3a10,0 0 6px rgba(0,0,0,.6);pointer-events:none;transform:translate(-50%,-50%);animation:rise .95s ease-out forwards}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}
/* окно лавки */
.shop .shopsay{margin:-4px 0 12px;color:var(--muted);font:italic 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ware{display:flex;align-items:center;gap:10px;padding:8px;background:#1a1612;border-radius:2px;box-shadow:inset 0 0 0 2px #2a221b,inset 0 -3px 0 0 #0c0a08}
.ware+.ware{margin-top:6px}
.wic{flex:none;width:44px;height:44px;display:grid;place-items:center;background:#0e0b09;border-radius:2px}
.wic canvas{position:static;transform:none;width:40px;height:40px;image-rendering:pixelated}
.shop{max-height:100%;overflow-y:auto}
.sells{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.sells h3{grid-column:1/-1;margin:0 0 4px;font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sell{display:flex;align-items:center;gap:6px;padding:2px 0;font:12px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);box-shadow:inset 0 1px 0 #2a221b}
.sic canvas{display:block;position:static;transform:none;width:40px;height:40px;image-rendering:pixelated}
.sell span{flex:1;min-width:0}
.sell b{display:flex;align-items:center;gap:4px;font:800 14px ui-monospace,Menlo,Consolas,monospace;color:#ffe08a;font-variant-numeric:tabular-nums}
.sell b i canvas{display:block;position:static;transform:none;width:14px;height:14px;image-rendering:pixelated}
.wtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wtx b{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg)}
.wtx span{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--muted)}
.buy{flex:none;display:flex;align-items:center;gap:5px;padding:7px 10px;font:800 15px ui-monospace,Menlo,Consolas,monospace;color:#ffe08a;background:#2a2014;border:0;border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--active),0 3px 0 #8a6a1e}
.buy i canvas{display:block;position:static;transform:none;width:16px;height:16px;image-rendering:pixelated}
.buy.poor{color:#8a7f66;box-shadow:inset 0 0 0 2px #5a5040,0 3px 0 #2e2820}
.buy.no{animation:no .3s}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.buy:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* кожаная сумка с инструментами: фон рисуется по пикселям в canvas, кнопки лежат точно на кармашках 3×3 */
.pouch{position:absolute;left:max(6px,env(safe-area-inset-left,0px));bottom:max(6px,env(safe-area-inset-bottom,0px));z-index:4;width:160px;height:180px}
.pouch .bagbg{position:absolute;left:0;top:0;transform:none;width:160px;height:180px;image-rendering:pixelated;pointer-events:none}
.tools{position:absolute;left:14px;top:38px;display:grid;grid-template-columns:repeat(3,40px);grid-auto-rows:40px;gap:4px}
.tool{position:relative;width:40px;height:40px;padding:0;display:grid;place-items:center;background:none;border:0;border-radius:3px;cursor:pointer}
.tool canvas{position:static;transform:none;width:40px;height:40px;image-rendering:pixelated}
.tool:disabled{cursor:default}
.tool[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #f2c14e,0 0 10px rgba(242,193,78,.45);background:radial-gradient(circle at 50% 45%,rgba(255,226,140,.42) 0%,rgba(255,226,140,0) 70%)}
.tool.off canvas{opacity:.6;filter:grayscale(.7)}
.tool:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:60%;text-align:center;font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b1406;background:var(--active);padding:5px 10px;border-radius:2px;box-shadow:0 2px 0 #8a6a1e;pointer-events:none}
.mapbtn{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -4px 0 0 var(--slot-dark)}
.mapbtn canvas,.cell canvas,.close canvas{position:static;transform:none}
.mapbtn canvas{width:32px;height:32px}
.mapbtn:focus-visible,.close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mapwrap{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(6,10,16,.6);padding:16px}
.map{position:relative;background:var(--bar);box-shadow:inset 0 0 0 2px var(--slot-edge),0 0 0 2px var(--slot-dark);border-radius:2px;padding:14px;width:min(100%,340px)}
.map h2{margin:0 0 12px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);padding-right:40px}
.close{position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;display:grid;place-items:center;background:var(--slot);border:0;border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--slot-edge),inset 0 -3px 0 0 var(--slot-dark)}
.close canvas{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;display:grid;place-items:center;background:#1a1612;border-radius:2px;box-shadow:inset 0 0 0 2px #2a221b,inset 0 -3px 0 0 #0c0a08}
.cell canvas{width:60%;height:60%}
.cell.on{background:#3a3220;box-shadow:inset 0 0 0 2px var(--active),inset 0 -3px 0 0 #8a6a1e,0 0 12px var(--active-glow)}
.cell.on canvas{width:84%;height:84%}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="bg" aria-hidden="true" style="pointer-events:none"></canvas>
    <canvas id="cv" aria-label="Участок"></canvas>
    <div class="coins" id="coins" aria-label="Монеты"><span class="ci" aria-hidden="true"></span><b id="coinN">0</b></div>
    <div class="depth" id="depth">0 / 30</div>
    <div class="toast" id="toast" role="status" hidden></div>
    <button class="mapbtn" id="mapbtn" aria-label="Карта участков" aria-haspopup="dialog"></button>
    <div class="pouch" role="toolbar" aria-label="Инструменты">
      <canvas class="bagbg" width="80" height="90" aria-hidden="true"></canvas>
      <div class="tools">
        <button class="tool" aria-pressed="false"></button><button class="tool" aria-pressed="false"></button><button class="tool" aria-pressed="false"></button>
        <button class="tool" aria-pressed="false"></button><button class="tool" aria-pressed="false"></button><button class="tool" aria-pressed="false"></button>
        <button class="tool" aria-pressed="false"></button><button class="tool" aria-pressed="false"></button><button class="tool" aria-pressed="false"></button>
      </div>
    </div>
  </div>
  <div class="mapwrap" id="shopwrap" hidden>
    <div class="map shop" role="dialog" aria-modal="true" aria-labelledby="shoptitle">
      <h2 id="shoptitle">Лавка под землёй</h2>
      <button class="close" id="shopclose" aria-label="Закрыть лавку"></button>
      <p class="shopsay" id="shopsay"></p>
      <div id="shoplist"></div>
    </div>
  </div>
  <div class="mapwrap" id="mapwrap" hidden>
    <div class="map" role="dialog" aria-modal="true" aria-labelledby="maptitle">
      <h2 id="maptitle">Участки</h2>
      <button class="close" id="mapclose" aria-label="Закрыть карту"></button>
      <div class="grid" id="mapgrid"></div>
    </div>
  </div>
</div>

<script type="module" src="house_main.js?v=7"></script>
</body>
</html>
